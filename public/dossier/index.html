<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Formulaire intelligent De Facto</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E4E4E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="De Facto">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"></head>
<body>
<style>
/* Layout : formulaire chronologique à gauche, note vivante collée à droite (≥ 1100 px) ; sous 1100 px, bascule Formulaire / Note */
:root{
  --bg:#F5F0E6; --surface:#FFFDF8; --sunk:#EDE6D9; --line:#DDD2C1; --fg:#291B2E; --muted:#6B5D6F;
  --accent:#CE5F38; --accent-ink:#A44526; --accent-soft:#F6E2D8; --azur:#2A7296; --azur-soft:#DDEBF2;
  --ok:#5C7A47; --ok-soft:#E4ECDC; --warn:#A8342B; --warn-soft:#F6DEDA; --amber:#9A6E12; --amber-soft:#F4EAD0;
  --display:"Fraunces",Georgia,serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18111B; --surface:#221926; --sunk:#2B2030; --line:#3A2E40; --fg:#F1EAE0; --muted:#B2A5B5;
  --accent:#E3774F; --accent-ink:#F29C79; --accent-soft:#3A2420; --azur:#6FB3D6; --azur-soft:#1D3340;
  --ok:#9DBB86; --ok-soft:#24301E; --warn:#F08A80; --warn-soft:#3A1E1C; --amber:#E2BA62; --amber-soft:#342B16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18111B; --surface:#221926; --sunk:#2B2030; --line:#3A2E40; --fg:#F1EAE0; --muted:#B2A5B5;
  --accent:#E3774F; --accent-ink:#F29C79; --accent-soft:#3A2420; --azur:#6FB3D6; --azur-soft:#1D3340;
  --ok:#9DBB86; --ok-soft:#24301E; --warn:#F08A80; --warn-soft:#3A1E1C; --amber:#E2BA62; --amber-soft:#342B16; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--azur);outline-offset:2px}

/* ---- barre du haut ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fg);color:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top .in{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font:600 1.2rem/1.1 var(--display);margin:0;letter-spacing:.01em}
.brand .tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.brand .sp{flex:1}
.tb{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);border-radius:7px;padding:6px 12px;font-size:.85rem;font-weight:600}
.tb:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}
.types{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tchip{flex:none;background:transparent;border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);color:var(--bg);border-radius:999px;padding:6px 13px;font-size:.86rem;white-space:nowrap}
.tchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* ---- grille principale ---- */
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px;
  display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,38vw,460px);gap:24px;align-items:start}
#form{display:flex;flex-direction:column;gap:16px;min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);display:flex;flex-direction:column;gap:12px;min-width:0;max-height:calc(100vh - 130px)}
.mobbar{display:none}
@media (max-width:700px){.top{position:static}.side{top:0}}
@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  body:not([data-view="note"]) .side{display:none}
  body[data-view="note"] #form{display:none}
  .mobbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);gap:8px;
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mobbar button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;font-weight:600}
  .mobbar button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  #mobcount{font-weight:400;opacity:.75;font-size:.82rem}
}

/* ---- sections ---- */
.banner{background:var(--azur-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--azur) 35%,transparent);border-radius:9px;padding:10px 14px;font-size:.9rem}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sh{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sh h2{font:600 1.08rem/1.2 var(--display);margin:0;flex:1;text-wrap:balance}
.sstat{font-size:.74rem;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px}
.sstat.done{background:var(--ok-soft);color:var(--ok)}
.sstat.todo{background:var(--warn-soft);color:var(--warn)}
.sstat.opt{background:var(--sunk);color:var(--muted)}
.sb{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.sb h3{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:8px 0 0;font-weight:600}
.cnt{font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none;color:var(--accent-ink)}
.hint{color:var(--muted);font-size:.85rem;margin:0}

.field{display:flex;flex-direction:column;gap:7px;padding:10px 12px;border-radius:9px;background:var(--bg);border:1px solid transparent}
.field.miss{border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.field.ok{background:color-mix(in srgb,var(--ok-soft) 55%,var(--bg))}
.flab{display:flex;gap:9px;align-items:baseline;font-weight:600;font-size:.92rem}
.stepn{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.8rem;color:var(--accent-ink);min-width:1.5em}
.req{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);font-weight:700;margin-left:auto}
.field.ok .req{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.86rem;line-height:1.3;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sq{border-radius:6px;padding:4px 0;min-width:34px;text-align:center;font-family:var(--mono);font-size:.82rem}
.chip.add{border-style:dashed;color:var(--accent-ink)}
.chip.add:hover{background:var(--accent-soft)}
.chip.sugg:not(.on){border-color:var(--accent);color:var(--accent-ink)}
.mini{align-self:flex-start;background:transparent;border:1px dashed var(--azur);color:var(--azur);border-radius:7px;padding:5px 11px;font-size:.84rem;font-weight:600}
.mini:hover{background:var(--azur-soft)}
.txt{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:.9rem;min-width:0}
.field .txt{background:transparent;border-color:transparent;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 2px;font-size:.86rem}
.field .txt:focus{background:var(--surface);border:1px solid var(--azur);border-radius:7px;padding:6px 9px}
.txt::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:.88rem;max-width:100%}
input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.lab{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
.lab.sm{font-size:.78rem}
.tog{display:inline-flex;gap:7px;align-items:center;font-size:.88rem;cursor:pointer}
.tog input{accent-color:var(--accent);width:17px;height:17px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.x{background:transparent;border:1px solid var(--line);border-radius:7px;width:32px;height:32px;font-size:1.1rem;line-height:1;color:var(--muted);flex:none}
.x:hover{color:var(--warn);border-color:var(--warn)}
.card{display:flex;flex-direction:column;gap:9px;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.mlc{font-family:var(--mono);font-size:.78rem;color:var(--azur);font-weight:500}
.dn{width:64px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-family:var(--mono)}

/* examens */
.etools{display:flex;gap:8px}
.etable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.erow{display:grid;grid-template-columns:minmax(140px,1fr) auto;gap:6px 12px;align-items:center;padding:7px 12px;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow .txt{grid-column:1/-1}
.ename{font-size:.9rem}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg{border:0;background:var(--surface);padding:5px 10px;font-size:.8rem;border-left:1px solid var(--line)}
.seg:first-child{border-left:0}
.seg.on.N{background:var(--ok);color:#fff}
.seg.on.A{background:var(--warn);color:#fff}
.seg.on.NE{background:var(--muted);color:var(--surface)}
.psr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.erow{grid-template-columns:1fr}.psr{grid-template-columns:repeat(2,minmax(0,1fr))}}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
.tt{border-collapse:collapse;width:100%;font-size:.86rem}
.tt th{text-align:left;font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;background:var(--sunk);white-space:nowrap}
.tt td{padding:6px 8px;border-top:1px solid var(--line)}
.tt td .txt{min-width:160px}

/* traitements */
.picker{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:9px}
.pg{display:flex;flex-direction:column;gap:5px}
.pgl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.acte{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);scroll-margin-top:140px}
.ah{display:flex;align-items:center;gap:10px}
.ah h3{margin:0;font:600 1rem var(--display);letter-spacing:0;text-transform:none;color:var(--fg);flex:1}
.anum{font-family:var(--mono);font-size:.78rem;background:var(--accent-soft);color:var(--accent-ink);padding:2px 8px;border-radius:5px}
.steps{display:flex;flex-direction:column;gap:7px}
.odonto{display:flex;flex-direction:column;gap:3px;padding:8px;border-radius:9px;background:var(--sunk);overflow-x:auto}
.trow{display:grid;grid-template-columns:repeat(16,minmax(26px,1fr));gap:3px}
.trow.t{grid-template-columns:repeat(10,minmax(26px,1fr));padding-inline:calc(3 * (100% / 16))}
.trow.p:last-child{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.tooth{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 0;font:500 .76rem var(--mono);min-width:0}
.trow.t .tooth{background:color-mix(in srgb,var(--surface) 60%,var(--azur-soft))}
.tooth.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.trows{display:flex;flex-direction:column;gap:6px}
.tline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--bg)}
.tnum{font:600 .95rem var(--mono);min-width:2.2em}
.grp{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.mutelab{font-size:.74rem;color:var(--muted);margin-right:2px}
.tsum{margin-left:auto;font-family:var(--mono);font-size:.82rem;color:var(--accent-ink)}

/* ---- note ---- */
.notebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;flex:1}
.nh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nh h2{font:600 1.05rem var(--display);margin:0;flex:1}
.segsw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segsw button{border:0;background:var(--surface);padding:6px 11px;font-size:.82rem;font-weight:600}
.segsw button.on{background:var(--fg);color:var(--bg)}
#note{margin:0;padding:14px 16px;font:400 .82rem/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;overflow:auto;flex:1;min-height:160px}
.nf{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700;font-size:.95rem}
.primary:hover{background:var(--accent-ink)}
#copymsg{font-size:.84rem;color:var(--ok);min-height:1.1em}
.linkbtn{background:none;border:0;padding:0;color:var(--azur);text-decoration:underline;font-weight:600}
#fallback{width:100%;min-height:120px;font:.78rem var(--mono);border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:8px}
.chk{border-radius:10px;padding:10px 14px;font-size:.86rem;display:flex;flex-direction:column;gap:6px}
.chk ul{margin:0;padding-left:18px}
.chk.warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.chk.good{background:var(--ok-soft);color:var(--ok)}
.chk.voc{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}
#checks{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:34vh;flex:none}
details.js{flex:none}
@media (max-width:760px){#checks{max-height:none}}
details.js{font-size:.82rem;color:var(--muted)}
details.js pre{max-height:260px;overflow:auto;font:.72rem var(--mono);background:var(--bg);padding:8px;border-radius:7px}

/* ---- autocomplétion et lexique ---- */
#ac{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 28px color-mix(in srgb,var(--fg) 18%,transparent);overflow:hidden;display:flex;flex-direction:column}
.aci{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:transparent;padding:7px 11px;text-align:left;border-top:1px solid var(--line)}
.aci:first-child{border-top:0}
.aci small{color:var(--muted);font-size:.74rem}
.aci.sel,.aci:hover{background:var(--accent-soft)}
#lexdrawer{position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) 16px;gap:10px;box-shadow:-10px 0 30px color-mix(in srgb,var(--fg) 15%,transparent)}
.ldh{display:flex;align-items:center;gap:10px}
.ldh h2{flex:1;margin:0;font:600 1.1rem var(--display)}
#lexres{overflow:auto;display:flex;flex-direction:column;gap:8px}
.lexi{padding:9px 11px;border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;gap:3px;font-size:.86rem}
.ab{font-family:var(--mono);font-size:.78rem;color:var(--accent-ink)}
.ty{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;background:var(--sunk);padding:1px 6px;border-radius:4px;color:var(--muted)}
.ty.bad{background:var(--warn-soft);color:var(--warn)}
.le{color:var(--muted);font-size:.8rem}
.ld{font-size:.82rem}
.lw{font-size:.82rem;color:var(--warn);font-weight:600}

/* ---- v2 : quadrants, catégories, stepper, précisions ---- */
.picker{display:flex;flex-direction:column;gap:8px}
.qtabs{display:none;gap:6px;flex-wrap:wrap}
.qtab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:.84rem;font-weight:600}
.qtab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:var(--sunk);border-radius:10px}
.qb{display:flex;flex-direction:column;gap:4px;min-width:0}
.qbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qteeth{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.qgrid.prim .qb:nth-child(n+5) .qteeth{grid-template-columns:repeat(5,minmax(0,1fr))}
.tooth{padding:7px 0}
@media (max-width:760px){
  .qtabs{display:flex}
  .qgrid{grid-template-columns:1fr}
  .qb:not(.act){display:none}
  .qbl{display:none}
  .qteeth .tooth{padding:12px 0;font-size:.9rem}
}
.num{display:flex;align-items:center;gap:8px}
.nb{width:40px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:1.2rem;font-weight:600}
.nb:hover{border-color:var(--accent)}
.nv{min-width:3ch;text-align:center;font:600 1rem var(--mono)}
details.cat{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.cat>summary{cursor:pointer;padding:7px 11px;font-size:.86rem;font-weight:600;list-style:none;display:flex;gap:6px;align-items:center}
details.cat>summary::before{content:"›";display:inline-block;transition:transform .15s;color:var(--muted)}
details.cat[open]>summary::before{transform:rotate(90deg)}
details.cat>.chips{padding:2px 10px 10px}
details.cat.big>summary{padding:10px 12px;font-size:.92rem}
.sb.in{padding:4px 10px 12px}
.field details.cat+details.cat{margin-top:4px}
.addpick{display:flex;flex-direction:column;gap:5px;padding:10px;border:1px dashed var(--line);border-radius:9px}
.cardh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cardh .chips{flex:1}
.chip.ghost{border-style:dashed;color:var(--muted)}
.chip.ret.on{background:var(--ok);border-color:var(--ok)}
.ghostbtn{border-style:dashed;color:var(--muted);border-color:var(--line)}
.prec textarea{min-height:52px;resize:vertical;font:inherit;font-size:.9rem}
.mono{font-family:var(--mono);white-space:nowrap}
.flab.sm{font-size:.8rem;color:var(--muted)}
.orow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--bg);border-radius:8px}
.orow select{flex:1 1 220px}
.locs{display:flex;flex-direction:column;gap:6px}
.locn{font-weight:600;font-size:.86rem;min-width:9em}
.chip.sq.w{min-width:34px;padding:4px 8px;font-family:var(--body)}
.chips.anom{grid-column:1/-1;padding-top:4px}
@media (prefers-reduced-motion:reduce){details.cat>summary::before{transition:none}}

/* ---- v3 : assistant par section, sous-canevas, charting ---- */
.wiz{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.wz{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;font-size:.8rem;max-width:220px}
.wz .wn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font:600 .74rem var(--mono);flex:none}

/* ================= THÈME « verre monochrome » (v4.6) ================= */
:root{
  --bg:#F2F2F3; --surface:#FFFFFF; --sunk:#F1F1F3; --line:#E6E6EA; --fg:#141416; --muted:#8B8B93;
  --accent:#141416; --accent-ink:#141416; --accent-soft:#ECECEF; --on-accent:#FFFFFF;
  --azur:#3B3B42; --azur-soft:#EEEEF1; --ok:#141416; --ok-soft:#EDEDF0; --warn:#C2382E; --warn-soft:#FBEAE8; --amber:#8A6A1C; --amber-soft:#F5F0E2;
  --display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --glass:rgba(255,255,255,.42); --glass-line:rgba(255,255,255,.75); --shadow:0 1px 2px rgba(20,20,22,.04),0 10px 30px rgba(20,20,22,.06);
  --r-xl:28px; --r-lg:22px; --r-md:16px;
  --page:radial-gradient(1200px 700px at 12% 8%,#FFFFFF 0%,transparent 60%),radial-gradient(900px 600px at 92% 30%,#D9D9DD 0%,transparent 65%),radial-gradient(1000px 800px at 40% 100%,#CFCFD4 0%,transparent 60%),#E4E4E8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416; --surface:#1C1C20; --sunk:#26262B; --line:#303036; --fg:#F4F4F6; --muted:#9E9EA7;
  --accent:#F4F4F6; --accent-ink:#F4F4F6; --accent-soft:#2A2A30; --on-accent:#121214;
  --azur:#C9C9D0; --azur-soft:#26262B; --ok:#F4F4F6; --ok-soft:#2A2A30; --warn:#FF8A80; --warn-soft:#3A1F1D; --amber:#E2BA62; --amber-soft:#332B17;
  --glass:rgba(30,30,34,.55); --glass-line:rgba(255,255,255,.08); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --page:radial-gradient(1200px 700px at 12% 8%,#2A2A30 0%,transparent 60%),radial-gradient(900px 600px at 92% 30%,#1E1E23 0%,transparent 65%),#0C0C0E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1C1C20; --sunk:#26262B; --line:#303036; --fg:#F4F4F6; --muted:#9E9EA7;
  --accent:#F4F4F6; --accent-ink:#F4F4F6; --accent-soft:#2A2A30; --on-accent:#121214;
  --azur:#C9C9D0; --azur-soft:#26262B; --ok:#F4F4F6; --ok-soft:#2A2A30; --warn:#FF8A80; --warn-soft:#3A1F1D; --amber:#E2BA62; --amber-soft:#332B17;
  --glass:rgba(30,30,34,.55); --glass-line:rgba(255,255,255,.08); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --page:radial-gradient(1200px 700px at 12% 8%,#2A2A30 0%,transparent 60%),radial-gradient(900px 600px at 92% 30%,#1E1E23 0%,transparent 65%),#0C0C0E; color-scheme:dark}
body{background:var(--page);background-attachment:fixed;font-family:var(--body);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}

function cuspsFor(d){
  d=+d; const q=Math.floor(d/10), n=d%10, up=[1,2,5,6].includes(q), prim=q>=5;
  if(prim){ if(n>=4) return up?["MV","DV","MP","DP"]:["MV","DV","ML","DL"]; return n===3?["pointe cuspidienne","versant mésial","versant distal"]:["bord incisif","angle mésio-incisif","angle disto-incisif"]; }
  if(n>=6) return up?["MV","DV","MP","DP"]:["MV","DV","D","ML","DL"];
  if(n>=4) return up?["V","P"]:(n===5?["V","ML","DL"]:["V","L"]);
  if(n===3) return ["pointe cuspidienne","versant mésial","versant distal"];
  return ["bord incisif","angle mésio-incisif","angle disto-incisif"];
}

const CARP_TX = {composite:"1",amalgame:"1",temporaire:"1",endo_urg:"2",endo_s1:"2",endo_obt:"1",endo_1rdv:"2",exo_simple:"2",exo_chir:"3",alveolite:"1",biopsie:"1",gal:"1",gtc:"2",ppf_prep:"2",pont_prep:"3",onlay_prep:"1",facette_prep:"2"};
const carpN = v => parseFloat(String(v||"0").replace(",","."))||0;
function autoAnesth(){
  const A=S.anesth; if(A.man || A.aucune) return;
  const rows=[], ag=A.agent||ANESTH_AGENTS[1].l;
  const put=(tech,site,carp,key)=>{ const r=rows.find(x=>x.key===key); if(r){ if(carpN(carp)>carpN(r.carp)) r.carp=carp; if(!r.sites.includes(site)) r.sites.push(site); } else rows.push({agent:ag, carp, tech, sites:[site], key, auto:true}); };
  AXD().filter(a=>CAN[a.cid].anesth).forEach(a=>{ const cp=CARP_TX[a.cid]||"1";
    const T=(isPont(a)?pilTeeth(a):a.teeth).map(t=>String(t.d));
    /* une injection par bloc (côté) ou par quadrant d'infiltration, la dose du traitement s'applique au groupe */
    T.forEach(d=>{ const tech=techFor(d), q=d[0], n=+d.slice(-1), up=upper(d);
      if(/Spix/.test(tech)) put(tech, d, cp, "spix"+([4,8].includes(+q)?"D":"G"));
      else put(tech, d, cp, "inf"+q+a.uid);
      if(/^exo_/.test(a.cid) && up) put("infiltration palatine", d, "0,5", "pal"+q+a.uid);
      if(/^exo_/.test(a.cid) && !up && n>=6) put("bloc long buccal", d, "0,5", "lb"+q);
      if(a.cid==="gal"||a.cid==="gtc") put(up&&n<=3 ? "bloc nasopalatin (papille incisive)" : "bloc grand palatin", "palais (site donneur)", "0,5", "gp"); });
  });
  A.rows = rows.map(r=>({agent:r.agent, carp:r.carp, tech:r.tech, site: r.sites.length>1 ? r.sites.join(", ") : r.sites[0], auto:true}));
}
function techFor(d){ d=+d; const n=d%10; return (!upper(d) && n>=4) ? "bloc alvéolaire inférieur (Spix)" : "infiltration vestibulaire"; }

function defaultsOf(path, f){
  const m = path.match(/^actes\.(\d+)\.v\.(\w+)$/); if(m){ const a=S.actes[+m[1]]; return a.touched[m[2]] ? [] : acteDefault(a, f); }
  return S.ui.touched[path] ? [] : (f.d||[]);
}
function chip(path, v, on, mode, extra="", pre=false){ return `<button type="button" class="chip${on?" on":""}${on&&pre?" pre":""}" data-chip="${esc(path)}" data-v="${esc(v)}" data-mode="${mode}" aria-pressed="${on}" ${pre&&on?'title="Préréglage"':""} ${extra}>${esc(v)}</button>`; }
function fieldHTML(path, f, o, num){

  const head = `<div class="flab">${num?`<span class="stepn">${num}</span>`:""}<span>${esc(f.l)}</span>${f.req?`<span class="req">requis</span>`:""}</div>`;
  let body = ""; const dfl = (f.t==="one"||f.t==="multi") ? defaultsOf(path, f) : [];
  if(f.t==="text"){
    body = (f.qf?`<div class="chips">${f.qf.map(q=>`<button type="button" class="chip ghost" data-act="qf" data-p="${esc(path)}" data-v="${esc(q.replace(/[«»]/g,"").trim())}">${esc(q)}</button>`).join("")}</div>`:"")
      + `<input class="lx txt" type="text" data-t="${esc(path)}" value="${esc(o.t)}" placeholder="${esc(f.ph||"Écrire ici")}" autocomplete="off">`;
  } else if(f.t==="date"){

  } else if(f.t==="canal"){
    const base = path.replace(/\.pc$/,""), acc = getP(base+".acces")?.c||[]; o.m=o.m||{};
    Object.keys(o.m).forEach(k=>{ if(!acc.includes(k)) delete o.m[k]; });
    body = !acc.length ? `<p class="hint">Choisis d'abord les canaux.</p>` : acc.map(k=>{ const v=o.m[k]=o.m[k]||{lt:null,cal:""};
      return `<div class="tline"><span class="tnum">${esc(k)}</span><span class="grp"><span class="mutelab">LT</span><button type="button" class="nb" data-act="lt" data-p="${esc(path)}" data-k="${esc(k)}" data-d="-0.5" aria-label="Diminuer">−</button><span class="nv">${v.lt==null?"—":fmtN(v.lt)}</span><button type="button" class="nb" data-act="lt" data-p="${esc(path)}" data-k="${esc(k)}" data-d="0.5" aria-label="Augmenter">+</button><span class="mutelab">mm</span></span>
        <span class="grp"><span class="mutelab">Calibre</span>${["15","20","25","30","35","40","45","50","60"].map(c=>`<button type="button" class="chip sq${v.cal===c?" on":""}" data-act="cal" data-p="${esc(path)}" data-k="${esc(k)}" data-v="${c}" aria-pressed="${v.cal===c}">${c}</button>`).join("")}</span></div>`; }).join("");
  } else if(f.t==="num"){
    body = `<div class="num"><button type="button" class="nb" data-act="num" data-p="${esc(path)}" data-d="-1" aria-label="Diminuer">−</button><span class="nv">${o.n==null?"—":fmtN(o.n)}</span><button type="button" class="nb" data-act="num" data-p="${esc(path)}" data-d="1" aria-label="Augmenter">+</button>${o.n!=null?`<button type="button" class="mini" data-act="numclr" data-p="${esc(path)}">Effacer</button>`:""}</div>`;
  } else if(f.og){
    const mode = f.t==="one"?"one":"multi";
    body = Object.entries(f.og).map(([cat,opts])=>{ const n=opts.filter(v=>o.c.includes(v)).length;
      return `<details class="cat"${n?" open":""}><summary>${esc(cat)}${n?` <span class="cnt">${n}</span>`:""}</summary><div class="chips${opts.some(x=>x.length>38)?" list":""}">${opts.map(v=>chip(path,v,o.c.includes(v),mode,"",dfl.includes(v))).join("")}</div></details>`; }).join("");
  } else {
    const mode = f.t==="one"?"one":"multi";

  }
  return `<div class="field${isFilled?" ok":""}${f.req&&!isFilled?" miss":""}">${head}${body}</div>`;

function suggestDx(d){
  const t=S.tests.find(x=>String(x.d)===String(d)&&!x.tem); if(!t) return {};
  let p="", a="";
  if(t.froid==="+ prolongé"||t.chaud==="+ prolongé") p = (S.plainte.caractere?.c||[]).some(c=>["spontanée","nocturne","persistante après le stimulus"].includes(c)) || t.froid==="+ prolongé" ? "pulpite irréversible symptomatique" : "pulpite irréversible asymptomatique";
  else if(t.froid==="−" && (!t.chaud||t.chaud==="−")) p="nécrose pulpaire";
  else if(t.froid==="+") p = (S.plainte.caractere?.c||[]).includes("provoquée") ? "pulpite réversible" : "pulpe normale";
  if(t.percussion==="+"||t.palpation==="+") a = (S.plainte.infection?.c||[]).includes("enflure") ? "abcès apical aigu" : "parodontite apicale symptomatique";
  else if(t.percussion==="−" && t.palpation==="−") a="tissus apicaux normaux";
  return {p, a};
}

  else if(S.type==="manque") P.push(sManque());

    if(!qmrSkip()) P.push(sQMR());

      P.push(sPlainte());
      if(T().cible) P.push(sCibles());
      if(T().pedia) P.push(sPedia());
      P.push(sExamens());
      if(T().perio) P.push(sPerio());

      if(T().plan && optOn("plan")) P.push(sPlan());

  ac.hidden=false;
});

/* ============================================================
   BROUILLON CHIFFRÉ SUR L'APPAREIL (AES-GCM, clé non exportable)
   ============================================================ */
const DRAFT_KEY="df-draft-v1";
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("defacto",1); r.onupgradeneeded=()=>r.result.createObjectStore("k"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function cryptoKey(){
  const db=await idb();
  const get=()=>new Promise((res,rej)=>{ const q=db.transaction("k").objectStore("k").get("draft"); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
  let k=await get(); if(k) return k;
  k=await crypto.subtle.generateKey({name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  await new Promise((res,rej)=>{ const q=db.transaction("k","readwrite").objectStore("k").put(k,"draft"); q.onsuccess=res; q.onerror=()=>rej(q.error); });
  return k;
}
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function saveDraft(){
  try{ if(!isDirty()) return; const k=await cryptoKey(); const iv=crypto.getRandomValues(new Uint8Array(12));
    const data=JSON.stringify({...S, ui:{...S.ui, lastCopied:null}});
    const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, new TextEncoder().encode(data));
    localStorage.setItem(DRAFT_KEY, JSON.stringify({iv:b64(iv), ct:b64(ct), t:Date.now(), type:S.type})); }catch(e){}
}
let dt; function saveDraftSoon(){ clearTimeout(dt); dt=setTimeout(saveDraft, 1200); }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
async function checkDraft(){
  try{ const r=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); if(!r) return;
    const d=new Date(r.t); S.ui.draftInfo=(TYP[r.type]?.l||"note")+", "+d.toLocaleDateString("fr-CA")+" à "+d.toLocaleTimeString("fr-CA",{hour:"2-digit",minute:"2-digit"}); }catch(e){}
}
async function loadDraft(){
  try{ const r=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); if(!r) return false; const k=await cryptoKey();
    const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(r.iv)}, k, unb64(r.ct));
    S=JSON.parse(new TextDecoder().decode(pt)); S.ui.draftInfo=""; S.ui.view="form"; S.ui.edited=false; return true; }catch(e){ S.ui.draftInfo=""; clearDraft(); return false; }
}

document.addEventListener("click", e=>{ const b=e.target.closest("[data-proxy]"); if(b){ const t=$("#"+b.dataset.proxy); if(t) t.click(); } });
function goStep(d){ if(S.ui.view!=="form") return; const n=sectionsList().length, k=S.ui.step+d; if(k<0||k>=n) return; S.ui.step=k; renderForm(); window.scrollTo({top:0, behavior:"smooth"}); }
(()=>{ let x0=null, y0=null, ok=false;
  document.addEventListener("touchstart", e=>{ const t=e.target; ok = !!t.closest("#form") && !t.closest(".scroll,.wiz,input,textarea,select,.qtabs,#note"); if(!ok) return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
  document.addEventListener("touchend", e=>{ if(!ok||x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null; if(Math.abs(dx)>70 && Math.abs(dy)<45) goStep(dx<0?1:-1); }, {passive:true});
})();
document.addEventListener("keydown", e=>{ if(!e.altKey || e.ctrlKey || e.metaKey) return; if(e.key==="ArrowRight"||e.key==="ArrowDown"){ e.preventDefault(); goStep(1); } if(e.key==="ArrowLeft"||e.key==="ArrowUp"){ e.preventDefault(); goStep(-1); } });

function exTx(cid, vid, teeth, o={}){ const a=newActe(cid, vid); a.vm=true;
  a.teeth=(teeth||[]).map(x=>{ const [d,sf]=String(x).split(" "); const t={d, s:sf?sf.split(""):[], b:"", bm:false}; if(t.s.length) t.b=deduceBlack(t.d,t.s); return t; });
  if(o.arc) a.arc=o.arc; S.actes.push(a); acteEffects(a);
  const TT=a.teeth.length?a.teeth:[a]; if(a.teeth.length) a.teeth.forEach(t=>initToothDx(a,t)); else initActeDx(a); autoByTooth(a);
  TT.forEach(t=>{ if(o.dx) t.dx=o.dx; if(o.dx2!=null) t.dx2=o.dx2; t.dxok=true; t.pro=o.pro||"bon"; if(o.pj) t.pj=[...o.pj]; if(o.rec){ t.rec=o.rec; t.recm=true; if(o.why) t.why=o.why; } });
  if(o.set) Object.entries(o.set).forEach(([k,v])=>{ a.v[k]=Array.isArray(v)?{c:v}:v; a.touched[k]=true; });
  if(o.refus){ a.cons.mode="refus du patient"; a.cons.rf=o.refus; a.cons.ri=["conséquences du refus expliquées","patient informé qu'il peut revenir sur sa décision"]; }
  if(o.prec) S.prec[a.uid]=o.prec; return a; }
