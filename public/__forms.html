<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
  </head>
  <body>
    <!-- Hidden form templates so Netlify can detect and register them at build time. -->

    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="subject" />
      <textarea name="message"></textarea>
      <input name="consent_contact" />
      <input name="consent_privacy" />
    </form>

    <form name="appointment" netlify netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="dob" />
      <input name="phone" />
      <input name="email" />
      <input name="address" />
      <input name="preferredLanguage" />
      <input name="existingPatient" />
      <input name="reasonOther" />
      <input name="symptomDuration" />
      <input name="availabilityNotes" />
      <input name="hasInsurance" />
      <input name="insuranceType" />
      <input name="insurer" />
      <input name="policy" />
      <input name="certificate" />
      <input name="primaryInsuredDob" />
      <input name="relationToPrimary" />
      <input name="medications" />
      <input name="allergies" />
      <input name="conditionDetails" />
      <input name="accommodations" />
      <input type="file" name="documents" />
      <input name="consent_contact" />
      <input name="consent_no_replace" />
      <input name="consent_no_confirmation" />
      <input name="consent_use" />
      <input name="consent_privacy" />
      <input name="consent_emergency" />
      <input name="consent_communications" />
    </form>

    <form name="emergency" netlify netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="phone" />
      <input name="email" />
      <input name="dob" />
      <input name="symptomDuration" />
      <input type="file" name="photo" />
      <input name="consent_emergency" />
      <input name="consent_contact" />
      <input name="consent_privacy" />
    </form>

    <!-- Brouillon 2: lab-professional kept for backwards compat (no new submissions expected) -->
    <form name="lab-professional" netlify netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field" />
      <input name="dentistName" />
      <input name="clinic" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="caseType" />
      <input name="material" />
      <textarea name="comments"></textarea>
      <input type="file" name="stlFile" />
      <input type="file" name="photos" />
      <input name="consent_contact" />
      <input name="consent_privacy" />
    </form>

    <!-- Brouillon 2: Partner onboarding for professional collaboration intake -->
    <form name="partner-onboarding" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="dentistName" />
      <input name="licenseNumber" />
      <input name="clinicName" />
      <input name="clinicAddress" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="preferredContactMode" />
      <input name="service_orthodontie" />
      <input name="service_prostho_amovible" />
      <input name="service_prostho_fixe" />
      <input name="service_plo" />
      <input name="service_gouttieres" />
      <input name="service_wax_up" />
      <input name="service_prise_teinte" />
      <input name="service_esthetique" />
      <input name="service_reparations" />
      <input name="service_autre" />
      <input name="expectedVolume" />
      <textarea name="comments"></textarea>
      <input name="consent_contact" />
      <input name="consent_privacy" />
    </form>

    <!-- Brouillon 2: Referred case form (professional refers a patient case) -->
    <form name="referred-case" netlify netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field" />
      <input name="referringProfessionalName" />
      <input name="clinicName" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="patientName" />
      <input name="patientDob" />
      <textarea name="referralReason"></textarea>
      <input name="affectedTeeth" />
      <textarea name="relevantHistory"></textarea>
      <input name="requestedTreatment" />
      <input type="file" name="photos" />
      <input type="file" name="radiographs" />
      <input type="file" name="relevantFiles" />
      <textarea name="comments"></textarea>
      <input name="consent_clinical_responsibility" />
      <input name="consent_transmission" />
      <input name="consent_privacy" />
    </form>

    <!-- Brouillon 2: Lab prescription form (replaces lab-professional going forward) -->
    <form name="lab-prescription" netlify netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field" />
      <input name="prescribingProfessional" />
      <input name="clinicName" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="patientName" />
      <input name="prescriptionType" />
      <input name="affectedTeeth" />
      <input name="material" />
      <input name="shade" />
      <input name="applianceType" />
      <input name="desiredDeadline" />
      <input type="file" name="stlFiles" />
      <input type="file" name="photos" />
      <input type="file" name="radiographs" />
      <textarea name="clinicalNotes"></textarea>
      <textarea name="specialRequirements"></textarea>
      <input name="consent_clarification" />
      <input name="consent_privacy" />
    </form>
  </body>
</html>
