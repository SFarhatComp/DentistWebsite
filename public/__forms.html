<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
  </head>
  <body>
    <!--
      Declarations des formulaires pour Netlify.

      Netlify lit ce fichier au deploiement pour savoir quels formulaires
      existent et quels champs enregistrer. Un champ envoye mais absent d'ici
      est perdu sans erreur : la soumission arrive, le champ manque.

      Trois formulaires, un par page qui en porte un. Les formulaires du
      laboratoire et du portail professionnel de l'ancien site ont ete retires
      en meme temps que leurs pages.
    -->

    <!-- Page contact : ecrivez-nous -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="lang" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="subject" />
      <textarea name="message"></textarea>
      <input name="consent_contact" />
      <input name="consent_privacy" />
    </form>

    <!-- Page rendez-vous : demande de rappel, en complement de l'horaire en ligne -->
    <form name="rappel" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="lang" />
      <input name="nom" />
      <input name="telephone" type="tel" />
      <input name="courriel" type="email" />
      <input name="premiereVisite" />
      <input name="couverture" />
      <input name="motif" />
      <input name="jour" />
      <input name="moment" />
    </form>

    <!-- Page urgence : le type de situation conditionne les champs envoyes -->
    <form name="urgence" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="lang" />
      <input name="nom" />
      <input name="telephone" type="tel" />
      <input name="courriel" type="email" />
      <input name="type" />
      <input name="ou" />
      <input name="cote" />
      <input name="intensite" />
      <input name="depuis" />
      <input name="declencheurs" />
      <input name="quelleDent" />
      <input name="mal" />
      <input name="morceau" />
      <input name="bord" />
      <input name="fievre" />
      <input name="protheseType" />
      <input name="protheseProbleme" />
      <textarea name="description"></textarea>
      <input name="consentement" />
    </form>
  </body>
</html>
