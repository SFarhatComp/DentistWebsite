backend:
  name: git-gateway
  branch: main

# Chaque modification passe par une demande de révision avant publication.
publish_mode: editorial_workflow

media_folder: public/img
public_folder: /img

site_url: https://studiodefacto.ca
display_url: https://studiodefacto.ca
locale: fr

# Les fiches de services. Les autres pages vivent dans src/content/*.ts
# (texte relu ligne par ligne pour la conformité au Code de déontologie).
collections:
  - name: "services_fr"
    label: "Services (FR)"
    label_singular: "Service"
    folder: "content/services/fr"
    extension: "md"
    format: "frontmatter"
    create: false
    delete: false
    slug: "{{key}}"
    identifier_field: "title"
    fields: &service_fields
      - { label: "Clé (ne pas modifier)", name: "key", widget: "string" }
      - { label: "Adresse (slug)", name: "slug", widget: "string" }
      - { label: "Famille", name: "family", widget: "select", options: ["prevenir", "reparer", "remplacer", "aligner"] }
      - { label: "Photo (nom du fichier sans extension)", name: "image", widget: "string" }
      - { label: "Nom du service (commence par « Service de … » au besoin)", name: "title", widget: "string" }
      - { label: "Résumé pour la carte", name: "card", widget: "string" }
      - { label: "Titre principal H1", name: "h1", widget: "string" }
      - { label: "Titre Google (60 caractères au plus)", name: "seoTitle", widget: "string" }
      - { label: "Description Google (155 caractères au plus)", name: "description", widget: "text" }
      - { label: "Introduction", name: "intro", widget: "list" }
      - { label: "Quand consulter", name: "whenToConsult", widget: "list" }
      - { label: "Comment ça se passe", name: "steps", widget: "list" }
      - { label: "Options", name: "options", widget: "text", required: false }
      - { label: "Bon à savoir", name: "goodToKnow", widget: "text" }
      - label: "Questions fréquentes"
        name: "faq"
        widget: "list"
        fields:
          - { label: "Question", name: "q", widget: "string" }
          - { label: "Réponse", name: "a", widget: "text" }
      - { label: "Services liés (clés)", name: "related", widget: "list" }
      - label: "Sources"
        name: "sources"
        widget: "list"
        required: false
        fields:
          - { label: "Titre", name: "label", widget: "string" }
          - { label: "Lien", name: "url", widget: "string" }

  - name: "services_en"
    label: "Services (EN)"
    label_singular: "Service"
    folder: "content/services/en"
    extension: "md"
    format: "frontmatter"
    create: false
    delete: false
    slug: "{{key}}"
    identifier_field: "title"
    fields: *service_fields
