backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: public/uploads
public_folder: /uploads

site_url: https://studiodefacto.ca
display_url: https://studiodefacto.ca

publish_mode: editorial_workflow

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:

  # ================================
  # SERVICES (FR) — content seeded by developer; dentist edits copy
  # ================================
  - name: "services_fr"
    label: "Services (FR)"
    label_singular: "Service"
    folder: "content/services/fr"
    create: false
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: false
    fields:
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - { label: "Titre", name: "title", widget: "string", required: true }
      - { label: "Description courte", name: "shortDescription", widget: "text", required: true }
      - { label: "Image principale", name: "heroImage", widget: "image", required: false }
      - { label: "Quand consulter", name: "whenToConsult", widget: "list", required: false }
      - { label: "Étapes du traitement", name: "treatmentSteps", widget: "list", required: false }
      - { label: "Options possibles", name: "options", widget: "list", required: false }
      - { label: "Limites et risques", name: "limits", widget: "text", required: false }
      - { label: "Après le traitement", name: "aftercare", widget: "text", required: false }
      - label: "FAQ"
        name: "faq"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Réponse", name: "answer", widget: "text" }
      - { label: "Services liés (slugs)", name: "related", widget: "list", required: false }
      - { label: "Contenu", name: "body", widget: "markdown", required: false }

  # ================================
  # CASES / RÉALISATIONS (FR)
  # ================================
  - name: "cases_fr"
    label: "Réalisations (FR)"
    label_singular: "Réalisation"
    folder: "content/cases/fr"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: false
    sortable_fields: ["date", "title"]
    view_groups:
      - { label: "En vedette", field: "featured" }
      - { label: "Année", field: "date", pattern: '\d{4}' }
    fields:
      - { label: "Slug", name: "slug", widget: "string", required: true,
          pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Doit être en minuscules avec des tirets uniquement"] }
      - { label: "Titre", name: "title", widget: "string", required: true }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: true }
      - { label: "Étiquettes", name: "tags", widget: "list", required: false }
      - { label: "Extrait", name: "excerpt", widget: "text", required: true }
      - { label: "En vedette", name: "featured", widget: "boolean", default: false }
      - { label: "Image de couverture", name: "coverImage", widget: "image", required: false }
      - { label: "Type de traitement", name: "treatmentType", widget: "string", required: true }
      - { label: "Problème initial", name: "initialProblem", widget: "text", required: true }
      - { label: "Objectif", name: "objective", widget: "text", required: true }
      - { label: "Nombre de rendez-vous", name: "appointmentCount", widget: "number", required: false }
      - label: "Galerie"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Légende", name: "caption", widget: "string" }
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "Avant", value: "before" }
              - { label: "Après", value: "after" }
              - { label: "Normal", value: "normal" }
            default: "normal"
            required: false
      - { label: "Mention légale", name: "legalDisclaimer", widget: "text", required: true,
          default: "Résultat propre à ce patient. Une consultation est nécessaire pour évaluer les options adaptées à votre situation." }
      - { label: "Contenu", name: "body", widget: "markdown", required: true,
          hint: "Inclure les sections : ## Problème initial, ## Approche, ## Résultat" }

  # ================================
  # RESSOURCES PATIENTS (FR)
  # ================================
  - name: "ressources_fr"
    label: "Ressources patients (FR)"
    label_singular: "Ressource"
    folder: "content/ressources/fr"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - { label: "Titre", name: "title", widget: "string", required: true }
      - label: "Catégorie"
        name: "category"
        widget: "select"
        options:
          - { label: "Première visite", value: "premiere-visite" }
          - { label: "Post-opératoire", value: "post-op" }
          - { label: "Hygiène", value: "hygiene" }
          - { label: "Aligneurs", value: "aligneurs" }
          - { label: "Prévention", value: "prevention" }
      - { label: "Contenu", name: "body", widget: "markdown", required: true }

  # ================================
  # JOURNAL CLINIQUE (FR) — Phase 3
  # ================================
  - name: "journal_fr"
    label: "Journal clinique (FR)"
    label_singular: "Article"
    folder: "content/journal/fr"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - { label: "Titre", name: "title", widget: "string", required: true }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: true }
      - { label: "Catégorie", name: "category", widget: "string", required: true }
      - { label: "Extrait", name: "excerpt", widget: "text", required: true }
      - { label: "Image de couverture", name: "coverImage", widget: "image", required: false }
      - { label: "Contenu", name: "body", widget: "markdown", required: true }
