version: '3.8'

services:
  dentist-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: dentist-portfolio-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Named volume for node_modules to prevent overwriting
      - node_modules:/app/node_modules
      # Mount .next directory for faster rebuilds
      - next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true

volumes:
  node_modules:
  next_cache:
