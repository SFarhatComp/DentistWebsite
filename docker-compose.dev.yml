services:
  dentist-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: dentist-portfolio-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Named volume for node_modules — prevents host node_modules from overwriting
      # the container's. Wipe this volume after upgrading dependencies in package.json:
      #   docker compose -f docker-compose.dev.yml down -v
      - node_modules:/app/node_modules
      # Named volume for .next so HMR builds are fast across container restarts.
      - next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true

volumes:
  node_modules:
  next_cache:
