[build]
  # `npm ci` installe exactement le package-lock.json (chaîne d'approvisionnement).
  # `npm audit --omit=dev` fait échouer le build si une dépendance de production
  # a une vulnérabilité élevée ou critique (cahier, lot 8.2).
  command = "npm ci && npm audit --omit=dev --audit-level=high && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Netlify détecte Next.js et applique @netlify/plugin-nextjs.
# Redirections, réécritures FR/EN et en-têtes de sécurité des pages : next.config.js.

# Administration Decap CMS : seule zone qui charge des scripts externes,
# figés par version et vérifiés par empreinte (cahier, lot 8.8).
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com https://*.netlify.app https://*.netlify.com; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
