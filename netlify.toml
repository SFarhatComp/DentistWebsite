[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Netlify auto-detects Next.js and applies @netlify/plugin-nextjs.
# No manual plugin config needed.

# Redirect root to default locale (French-first)
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302

# Brouillon 2: Services → Soins URL renames
[[redirects]]
  from = "/fr/services"
  to = "/fr/soins"
  status = 301

[[redirects]]
  from = "/fr/services/*"
  to = "/fr/soins/:splat"
  status = 301

[[redirects]]
  from = "/en/services"
  to = "/en/soins"
  status = 301

[[redirects]]
  from = "/en/services/*"
  to = "/en/soins/:splat"
  status = 301

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Identity redirect for admin
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Language-specific hreflang headers
[[headers]]
  for = "/en/*"
  [headers.values]
    Link = '''</fr/>; rel="alternate"; hreflang="fr", </en/>; rel="alternate"; hreflang="en"'''

[[headers]]
  for = "/fr/*"
  [headers.values]
    Link = '''</en/>; rel="alternate"; hreflang="en", </fr/>; rel="alternate"; hreflang="fr"'''
