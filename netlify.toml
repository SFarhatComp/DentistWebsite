[build]
  # `npm ci` enforces the package-lock.json EXACTLY — refuses to install
  # if lockfile is missing/out of sync. Prevents drive-by version drift
  # which is the main npm supply chain attack vector.
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Defense-in-depth: skip optional packages, keep installs predictable
  NPM_FLAGS = "--no-audit --prefer-offline"

  # Le planning de rendez-vous Google, affiche dans /rendez-vous.
  #
  # Il est ici plutot que dans les variables du tableau de bord Netlify : ce
  # n'est pas un secret — le lien se retrouve dans le code source de la page,
  # c'est sa raison d'etre — et le garder versionne permet de voir quand il a
  # change, et de revenir en arriere.
  #
  # Pour le remplacer : Google Agenda > Pages de reservation > Partager >
  # Integrer. La marche a suivre complete est dans docs/rendez-vous-google.md.
  NEXT_PUBLIC_GOOGLE_RDV_URL = "https://calendar.google.com/appointments/schedules/AcZssZ0x0Po4d20TBGp5_9yh0X_TME4RBFpD0H9ECMwVawluBbAPPIMx-CuZTt8K8FV1Zbwce__CerKX"

# Netlify auto-detects Next.js and applies @netlify/plugin-nextjs.
# No manual plugin config needed.

# Redirect root to default locale (French-first)
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Identity redirect for admin
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Language-specific hreflang headers
[[headers]]
  for = "/en/*"
  [headers.values]
    Link = '''</fr/>; rel="alternate"; hreflang="fr", </en/>; rel="alternate"; hreflang="en"'''

[[headers]]
  for = "/fr/*"
  [headers.values]
    Link = '''</en/>; rel="alternate"; hreflang="en", </fr/>; rel="alternate"; hreflang="fr"'''

# Anciennes adresses, redirigees vers leur equivalent de la refonte v2.
#
# Le site n'est pas encore reference par Google, mais une adresse a pu etre
# mise en favori ou partagee. Une redirection coute moins cher qu'une 404, et
# ces regles disparaitront d'elles-memes le jour ou plus personne ne les suit.
#
# Toutes pointent vers une page qui existe : les anciennes regles menaient a
# /laboratoire, supprimee par la refonte, donc a une 404 apres redirection.

# L'atelier a remplace la page laboratoire et ses sous-pages B2B.
[[redirects]]
  from = "/:lang/laboratoire"
  to = "/:lang/atelier"
  status = 301

[[redirects]]
  from = "/:lang/laboratoire/*"
  to = "/:lang/atelier"
  status = 301

# Les soins sont devenus les services.
[[redirects]]
  from = "/:lang/soins"
  to = "/:lang/services"
  status = 301

[[redirects]]
  from = "/:lang/soins/*"
  to = "/:lang/services"
  status = 301

