[build]
  # `npm ci` enforces the package-lock.json EXACTLY — refuses to install
  # if lockfile is missing/out of sync. Prevents drive-by version drift
  # which is the main npm supply chain attack vector.
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Defense-in-depth: skip optional packages, keep installs predictable
  NPM_FLAGS = "--no-audit --prefer-offline"

# Netlify auto-detects Next.js and applies @netlify/plugin-nextjs.
# No manual plugin config needed.

# Redirect root to default locale (French-first)
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Identity redirect for admin
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Language-specific hreflang headers
[[headers]]
  for = "/en/*"
  [headers.values]
    Link = '''</fr/>; rel="alternate"; hreflang="fr", </en/>; rel="alternate"; hreflang="en"'''

[[headers]]
  for = "/fr/*"
  [headers.values]
    Link = '''</en/>; rel="alternate"; hreflang="en", </fr/>; rel="alternate"; hreflang="fr"'''

# Routes retirées lors de la refonte 2026-09 (handoff §2).
# Redirigées plutôt que laissées en 404 : ces URL sont indexées et ont pu être
# mises en favori. Le contenu laboratoire B2B disparaît, mais l'adresse mène
# désormais à la page laboratoire conforme.
[[redirects]]
  from = "/:lang/laboratoire/professionnels"
  to = "/:lang/laboratoire"
  status = 301

[[redirects]]
  from = "/:lang/laboratoire/partenaires"
  to = "/:lang/laboratoire"
  status = 301

[[redirects]]
  from = "/:lang/laboratoire/prescription"
  to = "/:lang/laboratoire"
  status = 301

[[redirects]]
  from = "/:lang/laboratoire/reference-clinique"
  to = "/:lang/laboratoire"
  status = 301

[[redirects]]
  from = "/:lang/nouveaux-patients"
  to = "/:lang/premiere-visite"
  status = 301

[[redirects]]
  from = "/:lang/ressources"
  to = "/:lang/premiere-visite"
  status = 301

[[redirects]]
  from = "/:lang/ressources-patients"
  to = "/:lang/premiere-visite"
  status = 301
